<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PaperLens</title>
  <style>
    :root { --line:#e3e6eb; --text:#1c2028; --muted:#6b7280; --accent:#2f6bff; --panel:#fff; --bg:#f7f8fa; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --line:#32363d; --text:#e6e8ec; --muted:#9aa1ac; --accent:#6b95ff; --panel:#1e2126; --bg:#17191d; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { width: 280px; margin: 0; padding: 14px; background: var(--bg); color: var(--text);
           font: 13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
    h1 { font-size: 15px; margin: 0 0 2px; display:flex; align-items:center; gap:6px; }
    p.sub { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    button { width: 100%; font: inherit; padding: 8px 10px; margin-bottom: 8px;
             border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
             color: var(--text); cursor: pointer; text-align: left; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align:center; }
    button:disabled { opacity: .5; cursor: default; }
    .status { font-size: 11.5px; color: var(--muted); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
    .warn { color: #d92d20; }
  </style>
</head>
<body>
  <h1>📄 PaperLens</h1>
  <p class="sub">PDF 论文翻译与解读</p>
  <button id="open-current" class="primary" disabled>用 PaperLens 打开当前页</button>
  <button id="open-blank">打开本地 PDF…</button>
  <button id="open-options">设置（模型 / API Key）</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
